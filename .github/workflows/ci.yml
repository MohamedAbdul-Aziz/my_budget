name: CI

on:
  pull_request:
  # release.yml runs the same checks before it builds anything.
  workflow_call:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the Flutter used locally; a new SDK can bring new
          # analyzer lints and change golden-free widget layouts.
          flutter-version: 3.35.4
          channel: stable
          cache: true

      # The data tests open real SQLite through sqflite_common_ffi, which loads
      # the system libsqlite3.so that only the -dev package links.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
